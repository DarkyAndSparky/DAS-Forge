# Security checks that run beside the tests: known vulnerabilities, package signatures, static analysis,
# leaked secrets, lock file sanity, the Docker image. Not executed by its author (no network in the
# dev sandbox): the first run on GitHub is the first run. Action versions are tags; docs/guide/10-operations.md
# ("Безопасность репозитория и релиза") says how to pin them to commit hashes.
name: Security
on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # weekly: new advisories appear without any change in the repository

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit and package signatures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Production dependencies only; fails on high and critical.
      - run: npm audit --omit=dev --audit-level=high
      # Every installed package carries a registry signature (and provenance where published).
      - run: npm audit signatures

  lockfile:
    name: lock file sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Packages may only come from the npm registry over HTTPS (a swapped URL in the lock file is a classic attack).
      - run: npx --yes lockfile-lint@4 --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the whole history: a secret removed later is still a leaked secret
      # Free for personal accounts; an organisation needs a licence key (secret GITLEAKS_LICENSE).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  image:
    name: Docker image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t das-forge:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: das-forge:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
